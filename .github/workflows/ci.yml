name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- Python (roda se existir pyproject.toml) ----------
      - if: hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: hashFiles('pyproject.toml') != ''
        name: Install
        run: pip install -e ".[dev]"
      - if: hashFiles('pyproject.toml') != ''
        name: Lint
        run: |
          ruff check .
          ruff format --check .
      - if: hashFiles('pyproject.toml') != ''
        name: Test
        run: pytest -q

      # ---------- Node (runs if web/package.json exists) ----------
      - if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: hashFiles('web/package.json') != ''
        name: Install web dependencies
        working-directory: web
        run: npm ci
      - if: hashFiles('web/package.json') != ''
        name: Test web
        working-directory: web
        run: npm test --if-present
      - if: hashFiles('web/package.json') != ''
        name: Build web
        working-directory: web
        run: npm run build --if-present
